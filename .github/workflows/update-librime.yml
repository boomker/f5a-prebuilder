name: Update librime

on:
  schedule:
    - cron: '0 10 * * *' # daily at 10:00 UTC (18:00 Beijing Time)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow trigger token
        env:
          PREBUILDER_PUSH_TOKEN: ${{ secrets.PREBUILDER_PUSH_TOKEN }}
        run: |
          if [ -z "$PREBUILDER_PUSH_TOKEN" ]; then
            echo "::error::Missing PREBUILDER_PUSH_TOKEN. Configure a PAT or GitHub App token with contents:write on boomker/f5a-prebuilder so update commits trigger downstream workflows."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Push with a non-GITHUB_TOKEN credential so the update commit's
          # push event can trigger CI, which then triggers Publish Prebuilt.
          token: ${{ secrets.PREBUILDER_PUSH_TOKEN }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check and update librime
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -e
          # Fetch latest master in the librime submodule
          git -C librime fetch origin master
          NEWREV=$(git -C librime rev-parse origin/master)
          OLDREV=$(git -C librime rev-parse HEAD)
          if [ "$NEWREV" = "$OLDREV" ]; then
            echo "librime is up-to-date"
          else
            # Update the submodule to remote tip of its configured branch
            git submodule update --remote --checkout librime
            git add librime
            BRANCH=${GITHUB_REF#refs/heads/}
            echo "Committing update on branch $BRANCH"
            git commit -m "chore: update librime to ${NEWREV:0:7}" || echo "Nothing to commit"
            git push origin HEAD:$BRANCH
          fi

      - name: Check and update librime-predict-leveldb
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -e
          # Fetch latest master in the librime-predict-leveldb submodule
          git -C librime-predict-leveldb fetch origin main
          NEWREV=$(git -C librime-predict-leveldb rev-parse origin/main)
          OLDREV=$(git -C librime-predict-leveldb rev-parse HEAD)
          if [ "$NEWREV" = "$OLDREV" ]; then
            echo "librime-predict-leveldb is up-to-date"
          else
            # Update the submodule to remote tip of its configured branch
            git submodule update --remote --checkout librime-predict-leveldb
            git add librime-predict-leveldb
            BRANCH=${GITHUB_REF#refs/heads/}
            echo "Committing update on branch $BRANCH"
            git commit -m "chore: update librime-predict-leveldb to ${NEWREV:0:7}" || echo "Nothing to commit"
            git push origin HEAD:$BRANCH
          fi
